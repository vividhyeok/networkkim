st인지 response인지.\n- message syntax: field가 어떻게 배열되는지.\n- message semantics: field의 의미.\n- timing/rule: 언제 보내고 어떻게 응답하는지.\n\n### 3.5 Transport service 요구사항\n\n앱마다 transport layer에 요구하는 것이 다르다.\n\n- file transfer, web, e-mail: reliable data transfer가 중요.\n- streaming, VoIP: 약간의 loss보다 timing이 중요할 수 있음.\n- bandwidth-sensitive app: 일정 throughput 필요.\n- elastic app: 가능한 만큼 쓰면 됨. Web이 대표적.\n\nTCP는 reliable, in-order, congestion control, flow control, connection-oriented를 제공한다. UDP는 최소 기능만 제공하고 빠르고 단순하다. TCP/UDP 자체는 암호화를 제공하지 않으므로 TLS 같은 보안 계층이 붙는다."])</script><script>self.__next_f.push([1,"79:T78f,"])</script><script>self.__next_f.push([1,"### 4.1 HTTP 기본\n\nHTTP는 Web의 application-layer protocol이다.\n\n- client: browser.\n- server: Web server.\n- 기본 동작: client가 request를 보내고 server가 response를 보냄.\n- TCP 위에서 동작.\n- HTTP server는 기본적으로 client 상태를 저장하지 않는 **stateless** protocol로 설명된다.\n\n### 4.2 Non-persistent vs persistent HTTP\n\nNon-persistent HTTP는 object마다 TCP connection을 새로 만든다. 기본적으로 한 object를 받는 데 TCP connection setup 1 RTT + HTTP request/first byte response 1 RTT가 필요하다.\n\nPersistent HTTP는 하나의 TCP connection으로 여러 object를 주고받아 RTT 낭비를 줄인다.\n\n### 4.3 HTTP message\n\nRequest message의 핵심 구조는 다음과 같다.\n\n```text\nrequest line: method URL version\nheader lines\nblank line\noptional entity body\n```\n\n자주 나오는 method:\n\n- GET: resource 요청.\n- POST: form data 등을 body에 담아 전송.\n- HEAD: body 없이 header만 요청.\n- PUT: resource upload/replace.\n\nResponse message는 status line, header, body로 구성된다.\n\n대표 status code:\n\n| Code | 의미 |\n|---:|---|\n| 200 | OK |\n| 301 | Moved Permanently |\n| 400 | Bad Request |\n| 404 | Not Found |\n| 505 | HTTP Version Not Supported |\n\n### 4.4 Cookie\n\nHTTP는 stateless이므로 사용자를 기억하려면 cookie를 쓴다.\n\n- server가 `Set-Cookie` header로 cookie를 보낸다.\n- browser가 이후 request에 cookie를 포함한다.\n- server는 backend database와 cookie ID를 연결해 사용자 상태를 복원한다.\n\n### 4.5 Web cache / proxy\n\nWeb cache는 client 대신 origin server의 object를 저장해 둔다.\n\n효과:\n\n- client response time 감소.\n- access link traffic 감소.\n- origin server 부하 감소.\n\nConditional GET은 cache가 가진 object가 최신인지 확인하는 방식이다. `If-Modified-Since`를 보내고, 변경이 없으면 server가 `304 Not Modified`로 body 없이 응답한다."])</script><script>self.__next_f.push([1,"3e:[\"$\",\"div\",null,{\"style\":{\"width\":\"100%\",\"paddingBottom\":\"5rem\"},\"children\":[[\"$\",\"div\",null,{\"style\":{\"padding\":\"3rem 0 2rem\",\"marginBottom\":\"2rem\",\"borderBottom\":\"1px solid var(--border-color)\"},\"children\":[[\"$\",\"p\",null,{\"style\":{\"color\":\"var(--accent-blue)\",\"fontSize\":\"0.9rem\",\"fontWeight\":600,\"letterSpacing\":\"2px\",\"textTransform\":\"uppercase\",\"marginBottom\":\"0.5rem\"},\"children\":\"CHAPTER 02\"},\"$3f\",\"$74\",1],[\"$\",\"h1\",null,{\"style\":{\"fontSize\":\"2.2rem\",\"color\":\"#f1f5f9\",\"margin\":0,\"fontWeight\":700},\"children\":\"Chapter 2 - Application Layer 정리본\"},\"$3f\",\"$75\",1]]},\"$3f\",\"$73\",1],[\"$\",\"$L77\",null,{\"sections\":[{\"title\":\"\",\"level\":0,\"lines\":[\"\"],\"body\":\"\"},{\"title\":\"0. 이 장의 목적\",\"level\":2,\"lines\":[\"\",\"이 장은 네트워크 애플리케이션이 어떻게 만들어지고, 대표적인 application-layer protocol들이 어떤 방식으로 동작하는지 보는 장이다.\",\"\",\"핵심은 다음 한 문장이다.\",\"\",\"\u003e 네트워크 앱은 end system에서 실행되는 process들이 socket을 통해 transport service를 사용하여 메시지를 주고받는 구조다.\",\"\"],\"body\":\"이 장은 네트워크 애플리케이션이 어떻게 만들어지고, 대표적인 application-layer protocol들이 어떤 방식으로 동작하는지 보는 장이다.\\n\\n핵심은 다음 한 문장이다.\\n\\n\u003e 네트워크 앱은 end system에서 실행되는 process들이 socket을 통해 transport service를 사용하여 메시지를 주고받는 구조다.\"},{\"title\":\"2. 큰 흐름\",\"level\":2,\"lines\":[\"\",\"1. 네트워크 앱의 구조를 본다.\",\"   - client-server, P2P.\",\"2. process와 socket을 본다.\",\"   - app process는 socket을 통해 transport layer를 사용한다.\",\"3. HTTP/Web을 본다.\",\"   - request/response, persistent connection, cookie, cache.\",\"4. e-mail을 본다.\",\"   - SMTP는 push, POP3/IMAP은 pull.\",\"5. DNS를 본다.\",\"   - 이름을 IP 주소로 바꾸는 분산 계층 DB.\",\"6. P2P와 BitTorrent를 본다.\",\"7. streaming/CDN/DASH를 본다.\",\"8. UDP/TCP socket programming을 본다.\",\"\"],\"body\":\"1. 네트워크 앱의 구조를 본다.\\n   - client-server, P2P.\\n2. process와 socket을 본다.\\n   - app process는 socket을 통해 transport layer를 사용한다.\\n3. HTTP/Web을 본다.\\n   - request/response, persistent connection, cookie, cache.\\n4. e-mail을 본다.\\n   - SMTP는 push, POP3/IMAP은 pull.\\n5. DNS를 본다.\\n   - 이름을 IP 주소로 바꾸는 분산 계층 DB.\\n6. P2P와 BitTorrent를 본다.\\n7. streaming/CDN/DASH를 본다.\\n8. UDP/TCP socket programming을 본다.\"},{\"title\":\"3. 핵심 개념\",\"level\":2,\"lines\":[\"\",\"### 3.1 Network application은 어디서 도는가\",\"\",\"Application은 network core 장비가 아니라 **end system**에서 실행된다. Router는 user application을 실행하지 않고 packet forwarding에 집중한다.\",\"\",\"이 구조의 의미는 크다.\",\"\",\"- 개발자는 router 내부 소프트웨어를 건드리지 않아도 새 앱을 만들 수 있다.\",\"- 앱은 end system끼리 protocol만 맞추면 빠르게 배포된다.\",\"\",\"### 3.2 Client-server와 P2P\",\"\",\"| 구조 | 특징 | 장점 | 단점 |\",\"|---|---|---|---|\",\"| Client-server | 항상 켜진 server, 고정 IP, client는 server와 통신 | 관리 쉽고 안정적 | server 확장 비용 큼 |\",\"| P2P | peer들이 서로 서비스 요청/제공 | self-scalability | 관리/검색/보안 복잡 |\",\"\",\"P2P의 핵심은 새 peer가 demand를 늘리면서 동시에 upload capacity도 제공한다는 점이다.\",\"\",\"### 3.3 Process, socket, address\",\"\",\"- **Process**: host 안에서 실행 중인 program.\",\"- **Socket**: process가 network로 메시지를 내보내고 받는 문.\",\"- **Identifier**: 메시지를 받을 process를 찾기 위해 IP address와 port number가 필요하다.\",\"\",\"정리하면 다음과 같다.\",\"\",\"```text\",\"host 식별 = IP address\",\"process 식별 = port number\",\"network app 통신 = process -\u003e socket -\u003e transport layer\",\"```\",\"\",\"### 3.4 Application-layer protocol이 정하는 것\",\"\",\"Application-layer protocol은 다음을 정의한다.\",\"\",\"- message type: request인지 response인지.\",\"- message syntax: field가 어떻게 배열되는지.\",\"- message semantics: field의 의미.\",\"- timing/rule: 언제 보내고 어떻게 응답하는지.\",\"\",\"### 3.5 Transport service 요구사항\",\"\",\"앱마다 transport layer에 요구하는 것이 다르다.\",\"\",\"- file transfer, web, e-mail: reliable data transfer가 중요.\",\"- streaming, VoIP: 약간의 loss보다 timing이 중요할 수 있음.\",\"- bandwidth-sensitive app: 일정 throughput 필요.\",\"- elastic app: 가능한 만큼 쓰면 됨. Web이 대표적.\",\"\",\"TCP는 reliable, in-order, congestion control, flow control, connection-oriented를 제공한다. UDP는 최소 기능만 제공하고 빠르고 단순하다. TCP/UDP 자체는 암호화를 제공하지 않으므로 TLS 같은 보안 계층이 붙는다.\",\"\"],\"body\":\"$78\"},{\"title\":\"4. HTTP/Web\",\"level\":2,\"lines\":[\"\",\"### 4.1 HTTP 기본\",\"\",\"HTTP는 Web의 application-layer protocol이다.\",\"\",\"- client: browser.\",\"- server: Web server.\",\"- 기본 동작: client가 request를 보내고 server가 response를 보냄.\",\"- TCP 위에서 동작.\",\"- HTTP server는 기본적으로 client 상태를 저장하지 않는 **stateless** protocol로 설명된다.\",\"\",\"### 4.2 Non-persistent vs persistent HTTP\",\"\",\"Non-persistent HTTP는 object마다 TCP connection을 새로 만든다. 기본적으로 한 object를 받는 데 TCP connection setup 1 RTT + HTTP request/first byte response 1 RTT가 필요하다.\",\"\",\"Persistent HTTP는 하나의 TCP connection으로 여러 object를 주고받아 RTT 낭비를 줄인다.\",\"\",\"### 4.3 HTTP message\",\"\",\"Request message의 핵심 구조는 다음과 같다.\",\"\",\"```text\",\"request line: method URL version\",\"header lines\",\"blank line\",\"optional entity body\",\"```\",\"\",\"자주 나오는 method:\",\"\",\"- GET: resource 요청.\",\"- POST: form data 등을 body에 담아 전송.\",\"- HEAD: body 없이 header만 요청.\",\"- PUT: resource upload/replace.\",\"\",\"Response message는 status line, header, body로 구성된다.\",\"\",\"대표 status code:\",\"\",\"| Code | 의미 |\",\"|---:|---|\",\"| 200 | OK |\",\"| 301 | Moved Permanently |\",\"| 400 | Bad Request |\",\"| 404 | Not Found |\",\"| 505 | HTTP Version Not Supported |\",\"\",\"### 4.4 Cookie\",\"\",\"HTTP는 stateless이므로 사용자를 기억하려면 cookie를 쓴다.\",\"\",\"- server가 `Set-Cookie` header로 cookie를 보낸다.\",\"- browser가 이후 request에 cookie를 포함한다.\",\"- server는 backend database와 cookie ID를 연결해 사용자 상태를 복원한다.\",\"\",\"### 4.5 Web cache / proxy\",\"\",\"Web cache는 client 대신 origin server의 object를 저장해 둔다.\",\"\",\"효과:\",\"\",\"- client response time 감소.\",\"- access link traffic 감소.\",\"- origin server 부하 감소.\",\"\",\"Conditional GET은 cache가 가진 object가 최신인지 확인하는 방식이다. `If-Modified-Since`를 보내고, 변경이 없으면 server가 `304 Not Modified`로 body 없이 응답한다.\",\"\"],\"body\":\"$79\"},{\"title\":\"5. Electronic mail\",\"level\":2,\"lines\":[\"\",\"E-mail 시스템은 세 부분으로 볼 수 있다.\",\"\",\"- **User agent**: 사용자가 메일을 작성/읽는 프로그램.\",\"- **Mail server**: mailbox와 outgoing message queue를 관리.\",\"- **SMTP**: mail server 사이에서 메일을 전송하는 protocol.\",\"\",\"SMTP는 TCP 25번 포트를 사용하며, client에서 server로 메일을 **push**한다. 수신자가 메일을 읽을 때는 POP3 또는 IMAP을 사용한다.\",\"\",\"| Protocol | 역할 |\",\"|---|---|\",\"| SMTP | sender mail server -\u003e receiver mail server 전송 |\",\"| POP3 | client가 server에서 메일 다운로드 |\",\"| IMAP | server에 메일을 남겨두고 folder/status 동기화 |\",\"\"],\"body\":\"E-mail 시스템은 세 부분으로 볼 수 있다.\\n\\n- **User agent**: 사용자가 메일을 작성/읽는 프로그램.\\n- **Mail server**: mailbox와 outgoing message queue를 관리.\\n- **SMTP**: mail server 사이에서 메일을 전송하는 protocol.\\n\\nSMTP는 TCP 25번 포트를 사용하며, client에서 server로 메일을 **push**한다. 수신자가 메일을 읽을 때는 POP3 또는 IMAP을 사용한다.\\n\\n| Protocol | 역할 |\\n|---|---|\\n| SMTP | sender mail server -\u003e receiver mail server 전송 |\\n| POP3 | client가 server에서 메일 다운로드 |\\n| IMAP | server에 메일을 남겨두고 folder/status 동기화 |\"},{\"title\":\"6. DNS\",\"level\":2,\"lines\":[\"\",\"DNS는 domain name을 IP address로 바꾸는 분산 DB다.\",\"\",\"중앙집중 DNS가 아닌 이유:\",\"\",\"- single point of failure.\",\"- traffic volume.\",\"- distant centralized database로 인한 delay.\",\"- maintenance 어려움.\",\"\",\"DNS hierarchy:\",\"\",\"```text\",\"root DNS server\",\" -\u003e TLD DNS server (.com, .org, .kr 등)\",\" -\u003e authoritative DNS server\",\" -\u003e host name에 대한 IP address\",\"```\",\"\",\"Local DNS server는 hierarchy에 엄밀히 속하지는 않지만, 사용자의 질의를 받아 cache하고 대신 질의해 준다.\",\"\",\"대표 RR type:\",\"\",\"| Type | 의미 |\",\"|---|---|\",\"| A | hostname -\u003e IPv4 address |\",\"| NS | domain의 authoritative name server |\",\"| CNAME | alias name -\u003e canonical name |\",\"| MX | mail server 정보 |\",\"\",\"DNS 공격은 DDoS, redirect attack, cache poisoning 등이 핵심이다.\",\"\"],\"body\":\"DNS는 domain name을 IP address로 바꾸는 분산 DB다.\\n\\n중앙집중 DNS가 아닌 이유:\\n\\n- single point of failure.\\n- traffic volume.\\n- distant centralized database로 인한 delay.\\n- maintenance 어려움.\\n\\nDNS hierarchy:\\n\\n```text\\nroot DNS server\\n -\u003e TLD DNS server (.com, .org, .kr 등)\\n -\u003e authoritative DNS server\\n -\u003e host name에 대한 IP address\\n```\\n\\nLocal DNS server는 hierarchy에 엄밀히 속하지는 않지만, 사용자의 질의를 받아 cache하고 대신 질의해 준다.\\n\\n대표 RR type:\\n\\n| Type | 의미 |\\n|---|---|\\n| A | hostname -\u003e IPv4 address |\\n| NS | domain의 authoritative name server |\\n| CNAME | alias name -\u003e canonical name |\\n| MX | mail server 정보 |\\n\\nDNS 공격은 DDoS, redirect attack, cache poisoning 등이 핵심이다.\"},{\"title\":\"7. P2P와 BitTorrent\",\"level\":2,\"lines\":[\"\",\"Client-server file distribution은 server upload capacity가 병목이 된다. P2P는 peer들이 서로 조각을 나눠주므로 peer 수가 늘어도 전체 upload capacity가 같이 늘어난다.\",\"\",\"BitTorrent 흐름:\",\"\",\"1. file을 chunk로 나눈다.\",\"2. peer가 torrent에 참여한다.\",\"3. tracker가 peer 목록을 알려준다.\",\"4. peer들은 서로 chunk를 교환한다.\",\"5. rarest first로 희귀 chunk를 우선 요청한다.\",\"6. tit-for-tat으로 upload를 잘 해주는 peer에게 우선 upload한다.\",\"\"],\"body\":\"Client-server file distribution은 server upload capacity가 병목이 된다. P2P는 peer들이 서로 조각을 나눠주므로 peer 수가 늘어도 전체 upload capacity가 같이 늘어난다.\\n\\nBitTorrent 흐름:\\n\\n1. file을 chunk로 나눈다.\\n2. peer가 torrent에 참여한다.\\n3. tracker가 peer 목록을 알려준다.\\n4. peer들은 서로 chunk를 교환한다.\\n5. rarest first로 희귀 chunk를 우선 요청한다.\\n6. tit-for-tat으로 upload를 잘 해주는 peer에게 우선 upload한다.\"},{\"title\":\"8. Streaming, DASH, CDN\",\"level\":2,\"lines\":[\"\",\"Streaming stored video는 delay, bandwidth 변화, encoding rate 선택 문제가 중요하다.\",\"\",\"DASH의 핵심:\",\"\",\"- server는 같은 video를 여러 bitrate version으로 저장한다.\",\"- manifest file에 segment URL과 bitrate 정보를 둔다.\",\"- client가 현재 bandwidth와 buffer 상태를 보고 segment 품질을 선택한다.\",\"\",\"CDN은 content copy를 여러 지역 node에 배치하여 client와 가까운 곳에서 content를 제공한다. 핵심은 **content placement**와 **request routing**이다.\",\"\"],\"body\":\"Streaming stored video는 delay, bandwidth 변화, encoding rate 선택 문제가 중요하다.\\n\\nDASH의 핵심:\\n\\n- server는 같은 video를 여러 bitrate version으로 저장한다.\\n- manifest file에 segment URL과 bitrate 정보를 둔다.\\n- client가 현재 bandwidth와 buffer 상태를 보고 segment 품질을 선택한다.\\n\\nCDN은 content copy를 여러 지역 node에 배치하여 client와 가까운 곳에서 content를 제공한다. 핵심은 **content placement**와 **request routing**이다.\"},{\"title\":\"9. Socket programming\",\"level\":2,\"lines\":[\"\",\"UDP는 connection 없이 datagram을 주고받는다. TCP는 server가 먼저 socket을 열고 listen하며, client가 connect하면 connection socket을 통해 byte stream을 주고받는다.\",\"\",\"정리:\",\"\",\"```text\",\"UDP: sendto/recvfrom, destination IP+port를 매번 명시\",\"TCP: connect/accept 이후 connected socket으로 read/write\",\"```\",\"\"],\"body\":\"UDP는 connection 없이 datagram을 주고받는다. TCP는 server가 먼저 socket을 열고 listen하며, client가 connect하면 connection socket을 통해 byte stream을 주고받는다.\\n\\n정리:\\n\\n```text\\nUDP: sendto/recvfrom, destination IP+port를 매번 명시\\nTCP: connect/accept 이후 connected socket으로 read/write\\n```\"},{\"title\":\"10. 시험/복습 포인트\",\"level\":2,\"lines\":[\"\",\"- Client-server와 P2P의 scalability 차이를 설명할 수 있어야 한다.\",\"- Socket을 “process의 network door”로 설명할 수 있어야 한다.\",\"- HTTP request/response 구조, status code, cookie, cache를 구분할 수 있어야 한다.\",\"- SMTP/POP3/IMAP의 방향성을 구분해야 한다.\",\"- DNS hierarchy와 RR type을 설명할 수 있어야 한다.\",\"- DASH와 CDN의 역할을 구분해야 한다.\",\"- UDP/TCP socket interaction 순서를 그릴 수 있어야 한다.\",\"\"],\"body\":\"- Client-server와 P2P의 scalability 차이를 설명할 수 있어야 한다.\\n- Socket을 “process의 network door”로 설명할 수 있어야 한다.\\n- HTTP request/response 구조, status code, cookie, cache를 구분할 수 있어야 한다.\\n- SMTP/POP3/IMAP의 방향성을 구분해야 한다.\\n- DNS hierarchy와 RR type을 설명할 수 있어야 한다.\\n- DASH와 CDN의 역할을 구분해야 한다.\\n- UDP/TCP socket interaction 순서를 그릴 수 있어야 한다.\"}],\"chapterId\":\"ch02\"},\"$3f\",\"$76\",1]]},\"$3f\",\"$71\",1]\n"])</script><script>self.__next_f.push([1,"5c:D\"$7a\"\n5c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"},\"$47\",\"$7b\",0],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"},\"$47\",\"$7c\",0]]\n4e:D\"$7d\"\n4e:null\n67:D\"$7e\"\n67:[[\"$\",\"title\",\"0\",{\"children\":\"Network Visualizer\"},\"$47\",\"$7f\",0],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Interactive educational visualization of network concepts\"},\"$47\",\"$80\",0],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"},\"$47\",\"$81\",0],[\"$\",\"$L83\",\"3\",{},\"$47\",\"$82\",0]]\n"])</script></body></html>
